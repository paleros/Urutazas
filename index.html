<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Űrutazás a Kintsugi Bolygóra</title>
    <!-- Tailwind CSS a modern formázáshoz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti a megérkezési hatáshoz -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Csillagos mélyűr háttér */
        .space-bg {
            background: radial-gradient(circle at 50% 20%, #0d122e 0%, #060918 55%, #02030a 100%);
        }

        /* Lágy csillagköd fények */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            opacity: 0.28;
            animation: nebulaPulse 10s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.15) translate(15px, -10px); opacity: 0.35; }
        }

        /* Arany törésekkel díszített Kintsugi Bolygó ragyogása */
        .kintsugi-glow {
            box-shadow: 
                0 0 45px rgba(234, 179, 8, 0.35),
                0 0 90px rgba(30, 58, 138, 0.6),
                inset 0 0 35px rgba(250, 204, 21, 0.4);
            animation: planetBreathe 6s ease-in-out infinite alternate;
        }

        @keyframes planetBreathe {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.03); filter: brightness(1.12); }
        }

        /* Föld légkör glória */
        .earth-glow {
            box-shadow: 
                0 0 50px rgba(56, 189, 248, 0.45),
                0 -10px 40px rgba(96, 165, 250, 0.35),
                inset 0 0 30px rgba(56, 189, 248, 0.4);
        }

        /* Rakéta lebegő animáció mikor áll */
        .rocket-idle {
            animation: rocketFloat 3s ease-in-out infinite;
        }

        @keyframes rocketFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }

        /* Lángcsóva pulzálás */
        .flame-active {
            animation: flameFlicker 0.18s infinite alternate ease-in-out;
            transform-origin: top center;
        }

        @keyframes flameFlicker {
            0% { transform: scaleY(0.9) scaleX(0.95); opacity: 0.85; filter: drop-shadow(0 0 6px #f97316); }
            100% { transform: scaleY(1.25) scaleX(1.05); opacity: 1; filter: drop-shadow(0 0 16px #facc15); }
        }

        /* Füstgolyók / szikrák kibocsátása */
        .sparkle-trail {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #fef08a;
            pointer-events: none;
            animation: fadeOutDown 0.6s linear forwards;
        }

        @keyframes fadeOutDown {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(35px) scale(0.2); }
        }

        /* Arany erek animált fénylése a felső bolygón */
        .gold-vein {
            filter: drop-shadow(0 0 4px #facc15) drop-shadow(0 0 8px #eab308);
            animation: goldPulse 4s ease-in-out infinite alternate;
        }

        @keyframes goldPulse {
            0% { opacity: 0.8; stroke-width: 1.4; }
            100% { opacity: 1; stroke-width: 2.1; filter: drop-shadow(0 0 7px #fef08a); }
        }
    </style>
</head>
<body class="space-bg min-h-screen text-white overflow-hidden relative flex flex-col justify-between items-center selection:bg-yellow-400 selection:text-black">

    <!-- Dinamikus csillag canvas -->
    <canvas id="starsCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

    <!-- Kozmikus ködök a háttérben -->
    <div class="nebula w-96 h-96 bg-purple-700/25 top-8 -left-20"></div>
    <div class="nebula w-96 h-96 bg-blue-600/25 bottom-24 -right-16"></div>
    <div class="nebula w-72 h-72 bg-amber-500/15 top-1/3 left-1/2 -translate-x-1/2"></div>

    <!-- FEJLÉC ÉS INFORMÁCIÓS SÁV -->
    <header class="relative z-20 w-full max-w-md pt-5 px-6 flex justify-between items-center">
        <div>
            <span class="text-xs uppercase tracking-widest text-blue-300 font-semibold flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Kozmikus Utazás
            </span>
            <h1 class="text-lg md:text-xl font-bold tracking-tight text-white flex items-center gap-2">
                Irány a Kék Bolygó
            </h1>
        </div>

        <!-- Haladási számláló doboz -->
        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 px-4 py-2 rounded-2xl shadow-xl flex flex-col items-end">
            <span class="text-[11px] text-gray-400 uppercase tracking-wider font-semibold">Távolság</span>
            <div class="text-sm font-bold text-yellow-400">
                <span id="stepCounter" class="text-lg text-white">0</span> / 30 <span class="text-xs text-yellow-300/80">lépés</span>
            </div>
        </div>
    </header>

    <!-- FŐ ŰRTÉR / MOZGÁSI CSATORNA -->
    <main class="relative z-10 w-full flex-1 max-w-md mx-auto flex flex-col justify-between items-center px-4 py-2">
        
        <!-- ================= FELSŐ CÉLBOLYGÓ (Sötétkék, arany Kintsugi törésekkel) ================= -->
        <div class="relative flex flex-col items-center mt-2 group cursor-pointer" onclick="celebrateClick()">
            <!-- Finom célpont jelző gyűrű -->
            <div class="absolute -inset-3 rounded-full border border-yellow-400/20 border-dashed animate-[spin_25s_linear_infinite] pointer-events-none"></div>

            <div class="w-32 h-32 md:w-36 md:h-36 rounded-full relative overflow-hidden kintsugi-glow transition-transform duration-500 hover:scale-105">
                <!-- Bolygó mélykék test és domborzat -->
                <svg viewBox="0 0 120 120" class="w-full h-full">
                    <defs>
                        <!-- Bolygó alapszín gradiens: gazdag sötétkék és indigó -->
                        <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#1e3a8a" />
                            <stop offset="45%" stop-color="#0f172a" />
                            <stop offset="85%" stop-color="#090d16" />
                            <stop offset="100%" stop-color="#030712" />
                        </radialGradient>

                        <!-- Arany erek aranyfény gradiense -->
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fef08a" />
                            <stop offset="35%" stop-color="#facc15" />
                            <stop offset="70%" stop-color="#eab308" />
                            <stop offset="100%" stop-color="#ca8a04" />
                        </linearGradient>

                        <!-- Árnyék a 3D szférikus hatáshoz -->
                        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="65%" stop-color="transparent" />
                            <stop offset="100%" stop-color="rgba(0, 0, 0, 0.85)" />
                        </radialGradient>
                    </defs>

                    <!-- Gömb alap -->
                    <circle cx="60" cy="60" r="58" fill="url(#planetGrad)" stroke="#3b82f6" stroke-width="0.75" />

                    <!-- Kintsugi arany törések (repedések és arany rögök) -->
                    <!-- Első fő hasadás -->
                    <path d="M 60 2 Q 52 25 65 38 T 42 62 T 68 85 Q 72 105 58 118" 
                          fill="none" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round" class="gold-vein" />

                    <!-- Elágazások -->
                    <path d="M 65 38 Q 80 42 98 32 M 85 38 L 92 50" 
                          fill="none" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round" class="gold-vein" />
                    
                    <path d="M 42 62 Q 22 66 10 58 M 28 64 L 20 78" 
                          fill="none" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round" class="gold-vein" />

                    <path d="M 68 85 Q 85 92 104 88" 
                          fill="none" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round" class="gold-vein" />

                    <!-- Arany por és kis kristályok a törések mentén -->
                    <circle cx="62" cy="32" r="1.5" fill="#fef08a" />
                    <circle cx="48" cy="56" r="1.3" fill="#fef08a" />
                    <circle cx="72" cy="78" r="1.6" fill="#fef08a" />
                    <circle cx="82" cy="40" r="1.2" fill="#fde047" />
                    <circle cx="25" cy="65" r="1.4" fill="#fde047" />

                    <!-- Felső megvilágítás és 3D árnyék réteg -->
                    <circle cx="60" cy="60" r="58" fill="url(#shadowGrad)" />
                    <!-- Fényudvar a szélén -->
                    <ellipse cx="45" cy="35" rx="30" ry="18" fill="white" opacity="0.08" />
                </svg>
            </div>
            
            <div class="mt-2 text-center">
                <span class="text-xs font-semibold text-yellow-300/90 tracking-wide bg-yellow-950/40 border border-yellow-500/30 px-3 py-0.5 rounded-full backdrop-blur-sm">
                    Kintsugi-Prime
                </span>
            </div>
        </div>

        <!-- ================= UTAZÁSI PÁLYA & RAKÉTA TENGELY ================= -->
        <div id="flightPath" class="relative w-full flex-1 my-2 flex items-center justify-center">
            
            <!-- Halvány útjelző vonal (Navigation Trajectory) -->
            <div class="absolute top-0 bottom-0 w-[2px] bg-gradient-to-b from-yellow-400/40 via-blue-400/30 to-sky-400/40"></div>
            <!-- Lépés jelölő pontok a pályán -->
            <div id="pathDots" class="absolute top-0 bottom-0 flex flex-col justify-between items-center py-4 pointer-events-none opacity-40">
                <!-- JS generálja vagy fix pontok adnak referenciát -->
            </div>

            <!-- MOZGÓ RAKÉTA KONTÉNER (JavaScript mozgatja a 'bottom' pozícióját) -->
            <div id="rocketContainer" class="absolute left-1/2 -translate-x-1/2 transition-all duration-500 ease-out z-20 flex flex-col items-center" style="bottom: 0%;">
                
                <div class="rocket-idle flex flex-col items-center">
                    <!-- Rakéta SVG -->
                    <div class="w-14 h-20 md:w-16 md:h-22 drop-shadow-[0_8px_16px_rgba(59,130,246,0.5)]">
                        <svg viewBox="0 0 64 88" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Szárnyak / Uszonyok -->
                            <path d="M12 55 L2 72 Q1 76 6 76 L18 73 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M52 55 L62 72 Q63 76 58 76 L46 73 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M28 55 L32 75 L36 55 Z" fill="#dc2626" />

                            <!-- Rakéta törzs -->
                            <path d="M32 4 C18 20 16 52 16 70 C16 73 48 73 48 70 C48 52 46 20 32 4 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
                            
                            <!-- Orr-kúp díszítés -->
                            <path d="M32 4 C24 16 21 28 20 34 C25 36 39 36 44 34 C43 28 40 16 32 4 Z" fill="#ef4444" />

                            <!-- Ablak (Kerek kabinablak csillogással) -->
                            <circle cx="32" cy="42" r="8" fill="#0284c7" stroke="#e2e8f0" stroke-width="2.5"/>
                            <circle cx="32" cy="42" r="5.5" fill="#38bdf8" />
                            <ellipse cx="30" cy="40" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.8" />

                            <!-- Törzs árnyékoló csík (Meseszerű mélység) -->
                            <path d="M42 37 C42 55 40 68 39 70 C44 69 46 60 46 54" fill="#e2e8f0" opacity="0.6"/>

                            <!-- Hajtómű fúvóka -->
                            <path d="M24 70 L22 76 L42 76 L40 70 Z" fill="#475569" stroke="#1e293b" stroke-width="1.2"/>
                        </svg>
                    </div>

                    <!-- Lángcsóva (Thruster flame) -->
                    <div id="rocketFlame" class="flame-active -mt-1.5 flex flex-col items-center">
                        <svg width="28" height="42" viewBox="0 0 28 42" fill="none">
                            <!-- Külső narancs láng -->
                            <path d="M14 42 C22 28 24 14 24 0 L4 0 C4 14 6 28 14 42 Z" fill="url(#flameOuter)" />
                            <!-- Belső citromsárga/fehér mag -->
                            <path d="M14 30 C19 20 20 10 20 0 L8 0 C8 10 9 20 14 30 Z" fill="url(#flameInner)" />
                            <defs>
                                <linearGradient id="flameOuter" x1="14" y1="0" x2="14" y2="42" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#ef4444" />
                                    <stop offset="40%" stop-color="#f97316" />
                                    <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
                                </linearGradient>
                                <linearGradient id="flameInner" x1="14" y1="0" x2="14" y2="30" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#ffffff" />
                                    <stop offset="50%" stop-color="#fef08a" />
                                    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= ALSÓ FÖLDGÖMB (Meseszerű, stilizált kontinensekkel) ================= -->
        <div class="relative flex flex-col items-center w-full mt-1">
            <div class="w-36 h-24 md:w-44 md:h-28 relative overflow-hidden earth-glow rounded-t-full flex items-center justify-center bg-gradient-to-b from-sky-400 via-blue-600 to-indigo-950 border-t-2 border-sky-300">
                <!-- Kontinensek és felhők SVG -->
                <svg viewBox="0 0 160 100" class="w-full h-full absolute top-0">
                    <!-- Meseszerű zöld kontinensek -->
                    <path d="M25 55 Q 35 30 55 45 T 80 60 Q 60 80 30 75 Z" fill="#22c55e" opacity="0.9" />
                    <path d="M95 40 Q 115 35 130 50 T 145 75 Q 120 90 95 70 Z" fill="#16a34a" opacity="0.95" />
                    <path d="M60 20 Q 75 10 85 22 T 70 35 Z" fill="#4ade80" opacity="0.85" />
                    <circle cx="110" cy="25" r="7" fill="#86efac" opacity="0.9" />

                    <!-- Finom fehér légköri felhőívek -->
                    <path d="M 10 35 Q 30 25 50 35 Q 70 45 90 35" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.45" />
                    <path d="M 75 55 Q 105 45 140 60" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.4" />
                </svg>

                <div class="absolute bottom-1 text-center">
                    <span class="text-[11px] font-bold text-sky-200 tracking-wider uppercase bg-blue-950/60 px-3 py-0.5 rounded-full border border-sky-400/30">
                        Föld (Bázis)
                    </span>
                </div>
            </div>
        </div>
    </main>

    <!-- VEZÉRLŐPULT ÉS GOMBOK (LENT) -->
    <footer class="relative z-20 w-full max-w-md px-6 pb-6 pt-2 flex flex-col items-center gap-3">
        <!-- Állapot visszajelző szöveg -->
        <p id="statusMsg" class="text-xs text-sky-300/80 tracking-wide font-medium text-center h-4">
            Készen áll a kilövésre. Nyomd meg a gombot az induláshoz!
        </p>

        <div class="w-full flex items-center gap-3">
            <!-- Fő Haladás Gomb -->
            <button id="stepBtn" onclick="nextStep()" 
                class="flex-1 py-3.5 px-6 rounded-2xl font-bold text-base tracking-wide text-slate-900 
                       bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 
                       hover:from-yellow-200 hover:to-amber-300 
                       active:scale-[0.98] transition-all duration-150 
                       shadow-[0_10px_25px_rgba(234,179,8,0.4)] hover:shadow-[0_12px_30px_rgba(234,179,8,0.6)] 
                       flex items-center justify-center gap-2 border border-yellow-200/50">
                <span id="btnIcon">🚀</span>
                <span id="btnText">Ugrás a bolygó felé</span>
            </button>

            <!-- Újrakezdés / Reset gomb -->
            <button id="resetBtn" onclick="resetJourney()" title="Vissza a Földre"
                class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 text-gray-300 hover:text-white transition-all active:scale-95 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </footer>

    <!-- ÜNNEPLŐ FELUGRÓ MODAL (Megérkezéskor) -->
    <div id="arrivalModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-yellow-500/40 p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 relative">
            <div class="w-16 h-16 mx-auto mb-4 bg-yellow-400/20 border border-yellow-400/50 rounded-2xl flex items-center justify-center text-3xl shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                🌌
            </div>
            <h2 class="text-2xl font-extrabold text-white mb-2">Megérkeztél!</h2>
            <p class="text-sm text-gray-300 mb-6 leading-relaxed">
                Sikeresen teljesítetted a 30 lépéses utat a rejtélyes kintsugi aranybolygóra. A felfedezés elkezdődött!
            </p>
            <button onclick="closeModalAndReset()" 
                class="w-full py-3 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-bold rounded-xl shadow-lg transition active:scale-95">
                Új küldetés indítása
            </button>
        </div>
    </div>

    <script>
        // Állapotváltozók
        let currentStep = 0;
        const totalSteps = 30;

        const rocketContainer = document.getElementById('rocketContainer');
        const rocketFlame = document.getElementById('rocketFlame');
        const stepCounter = document.getElementById('stepCounter');
        const statusMsg = document.getElementById('statusMsg');
        const stepBtn = document.getElementById('stepBtn');
        const btnText = document.getElementById('btnText');
        const arrivalModal = document.getElementById('arrivalModal');

        // Haladás kezelése
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateRocketPosition(true);

                // Apró szikrák kibocsátása lépéskor
                spawnSparks();

                if (currentStep === totalSteps) {
                    onArrival();
                } else {
                    updateStatusText();
                }
            }
        }

        // Rakéta pozíciójának frissítése (0% -> 90%)
        function updateRocketPosition(withSoundFeedback = false) {
            // A Földtől a bolygóig 0% és ~90% magasság között mozgatjuk
            const percentage = (currentStep / totalSteps) * 90;
            rocketContainer.style.bottom = `${percentage}%`;
            stepCounter.textContent = currentStep;

            // Fokozott láng animáció kattintáskor
            rocketFlame.style.transform = "scaleY(1.5) scaleX(1.15)";
            setTimeout(() => {
                rocketFlame.style.transform = "";
            }, 300);
        }

        // Állapotüzenetek aktualizálása az út során
        function updateStatusText() {
            if (currentStep <= 5) {
                statusMsg.textContent = "Felszállás! Elhagyjuk a Föld atmoszféráját...";
            } else if (currentStep <= 15) {
                statusMsg.textContent = "Átkelés a belső aszteroida övön...";
            } else if (currentStep <= 25) {
                statusMsg.textContent = "A Kintsugi-Prime gravitációs mezejéhez közeledünk...";
            } else if (currentStep < 30) {
                statusMsg.textContent = "Fékezőrakéták felkészítése a dokkoláshoz!";
            }
        }

        // Megérkezési esemény
        function onArrival() {
            statusMsg.textContent = "✨ Dokkolás sikeres a célbolygónál! ✨";
            btnText.textContent = "Cél elérve!";
            stepBtn.classList.replace('from-yellow-300', 'from-emerald-400');
            stepBtn.classList.replace('to-yellow-500', 'to-emerald-500');

            // Konfetti tűzijáték robbantása
            launchCelebrationConfetti();

            // Felugró ablak megjelenítése kis késleltetéssel
            setTimeout(() => {
                arrivalModal.classList.remove('opacity-0', 'pointer-events-none');
                arrivalModal.querySelector('div').classList.remove('scale-90');
                arrivalModal.querySelector('div').classList.add('scale-100');
            }, 700);
        }

        // Tűzijáték és arany konfetti animáció
        function launchCelebrationConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.3 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#facc15', '#eab308', '#60a5fa']
            });
            fire(0.2, {
                spread: 60,
                colors: ['#ffffff', '#fbbf24']
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                colors: ['#38bdf8', '#fbbf24', '#f59e0b']
            });
        }

        function celebrateClick() {
            if (currentStep === totalSteps) {
                launchCelebrationConfetti();
            }
        }

        // Reset funkció
        function resetJourney() {
            currentStep = 0;
            updateRocketPosition();
            statusMsg.textContent = "Készen áll a kilövésre. Nyomd meg a gombot!";
            btnText.textContent = "Ugrás a bolygó felé";
            stepBtn.classList.replace('from-emerald-400', 'from-yellow-300');
            stepBtn.classList.replace('to-emerald-500', 'to-yellow-500');
        }

        function closeModalAndReset() {
            arrivalModal.classList.add('opacity-0', 'pointer-events-none');
            arrivalModal.querySelector('div').classList.remove('scale-100');
            arrivalModal.querySelector('div').classList.add('scale-90');
            resetJourney();
        }

        // Szikrák keltése a rakéta alatt
        function spawnSparks() {
            const rect = rocketContainer.getBoundingClientRect();
            for (let i = 0; i < 4; i++) {
                const spark = document.createElement('div');
                spark.className = 'sparkle-trail';
                spark.style.left = `${rect.left + rect.width / 2 + (Math.random() * 16 - 8)}px`;
                spark.style.top = `${rect.bottom - 10}px`;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        // ================= CSILLAGOS HÁTTÉR GENERÁLÁSA =================
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const starCount = Math.floor((canvas.width * canvas.height) / 3200);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.4 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.005,
                    isGold: Math.random() > 0.88 // Néhány csillag arany színű
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let star of stars) {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.speed = -star.speed;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.isGold 
                    ? `rgba(254, 240, 138, ${Math.abs(star.alpha)})` 
                    : `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            }
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            resizeCanvas();
            animateStars();
        };
    </script>
</body>
</html>
